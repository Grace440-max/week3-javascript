<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Songa Learning Resource Explorer</title>
 <link rel="stylesheet" href="style.css">
 <script src="script.js" defer></script>
</head>
<body>
 <header>
 <h1>Songa Learning Resource Explorer</h1>
 <p>Explore resources, learn new skills, and track your progress.</p>
 </header>
 <main>
 <section class="controls">
 <label for="search-input">Search resources</label>
 <input
 type="text"
 id="search-input"
 placeholder="Search by title or description..."
 >
 <label for="category-filter">Filter by category</label>
 <select id="category-filter">
 <option value="all">All categories</option>
 <option value="JavaScript">JavaScript</option>
 <option value="CSS">CSS</option>
 <option value="Git & GitHub">Git & GitHub</option>
 <option value="Career Skills">Career Skills</option>
 </select>
 </section>
 <section class="progress">
 <p id="resource-count">Resources: 0</p>
 <p id="completed-count">Completed: 0</p>
 </section>
 <section>
 <h2>Learning Resources</h2>
 <div id="resource-list"></div>
 <p id="empty-message" hidden>
 No resources match your search. Try another search or category.
 </p>
 </section>
 </main>

</body>
</html>
